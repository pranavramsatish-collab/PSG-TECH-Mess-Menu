<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mess Committee — PSG Tech</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12150f">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   The mess committee's side of the app.

   Deliberately a SEPARATE page rather than a hidden tab in index.html: a
   student should never be one mistyped condition away from the queue, and the
   app stays the size it is.

   Nothing here is a security boundary. The email check below decides what to
   DRAW; what a person may actually read or change is decided by row-level
   security in Postgres, set up by 06_committee.sql. Anyone can open this file
   and read it — that is fine, because reading it grants nothing.
   ===================================================================== */
:root{
  --bg:#12150f; --panel:#171b12; --panel-2:#1e2417;
  --line:rgba(244,239,225,.12);
  --accent:#e7a93c; --accent-line:rgba(231,169,60,.34); --on-accent:#1b1f14;
  --ink:#f4efe1; --muted:rgba(244,239,225,.70); --faint:rgba(244,239,225,.46);
  --green:#8aab5a; --red:#c2482f; --blue:#6f9bc4;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:var(--bg); color:var(--ink); line-height:1.55;
  font-family:'Work Sans',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:60px;
}
.wrap{ max-width:820px; margin:0 auto; padding:0 18px; }

header{
  position:sticky; top:0; z-index:20; background:rgba(18,21,15,.93);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line); margin-bottom:22px;
}
.hrow{ display:flex; align-items:center; gap:12px; padding:15px 0; }
.mark{ width:32px; height:32px; border-radius:10px; background:var(--accent);
       display:grid; place-items:center; flex:none; }
h1{ font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:19px;
    letter-spacing:-.02em; line-height:1.1; }
.sub{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em;
      text-transform:uppercase; color:var(--faint); margin-top:2px; }
.spacer{ flex:1; }
.who{ font-size:12.5px; color:var(--faint); text-align:right; }
.linkbtn{ background:none; border:0; color:var(--accent); font:inherit; font-size:12px;
          cursor:pointer; padding:0; text-decoration:underline; }

.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
.stat{ background:var(--panel); border:1px solid var(--line); border-radius:14px;
       padding:13px 14px; }
.stat b{ display:block; font-family:'Fraunces',Georgia,serif; font-size:26px;
         font-weight:600; line-height:1; }
.stat span{ display:block; margin-top:6px; font-family:'JetBrains Mono',monospace;
            font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
.stat.s-submitted b{ color:var(--accent); }
.stat.s-reviewing b{ color:var(--blue); }
.stat.s-resolved  b{ color:var(--green); }

.filters{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
.filters button{
  font:inherit; font-size:12.5px; cursor:pointer; color:var(--muted);
  background:var(--panel); border:1px solid var(--line); border-radius:99px;
  padding:7px 14px; transition:all .18s;
}
.filters button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent);
  border-color:var(--accent); font-weight:600; }

.card{ background:var(--panel); border:1px solid var(--line); border-radius:16px;
       padding:16px; margin-bottom:12px; }
.card.busy{ opacity:.55; pointer-events:none; }
.ctop{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.hall{ font-weight:600; font-size:15px; }
.when{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--faint);
       letter-spacing:.06em; }
.chip{ font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.12em;
       text-transform:uppercase; padding:4px 10px; border-radius:99px; }
.chip.submitted{ background:rgba(231,169,60,.15); color:var(--accent); }
.chip.reviewing{ background:rgba(111,155,196,.16); color:var(--blue); }
.chip.resolved { background:rgba(138,171,90,.18); color:var(--green); }
.text{ font-size:15.5px; color:var(--ink); margin:8px 0 10px; white-space:pre-wrap;
       overflow-wrap:anywhere; }
.by{ font-size:12.5px; color:var(--faint); margin-bottom:12px; }
.by b{ color:var(--muted); font-weight:500; }
.ref{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--faint); }

.controls{ display:flex; gap:9px; align-items:flex-start; flex-wrap:wrap;
           border-top:1px solid var(--line); padding-top:12px; }
select, textarea{
  font:inherit; font-size:14px; color:var(--ink); background:var(--panel-2);
  border:1px solid var(--line); border-radius:11px; padding:9px 11px;
}
select{ flex:none; min-width:150px; }
textarea{ flex:1; min-width:190px; min-height:42px; resize:vertical; line-height:1.4; }
textarea::placeholder{ color:var(--faint); }
select:focus, textarea:focus{ outline:none; border-color:var(--accent-line); }
.save{
  font:inherit; font-size:14px; font-weight:600; cursor:pointer;
  background:var(--accent); color:var(--on-accent); border:0;
  border-radius:11px; padding:10px 18px; flex:none;
}
.save:disabled{ opacity:.4; cursor:default; }

/* The bucket is private, so a path is not renderable — each one is signed after
   the list paints. Clicking opens the full size in a new tab. */
.cphoto{
  display:block; margin-top:10px; max-width:260px; max-height:200px; width:100%;
  object-fit:cover; border-radius:12px; border:1px solid var(--line); cursor:zoom-in;
}
.cphoto:not(.ready){ display:none; }
.note{ background:var(--panel-2); border-left:2px solid var(--accent-line);
       border-radius:0 10px 10px 0; padding:9px 12px; margin-top:10px;
       font-size:13.5px; color:var(--muted); font-style:italic; }

.empty{ text-align:center; padding:56px 20px; color:var(--faint); }
.empty h3{ font-family:'Fraunces',Georgia,serif; font-size:19px; color:var(--muted);
           margin-bottom:6px; font-weight:500; }

/* gate */
.gate{ position:fixed; inset:0; z-index:60; background:var(--bg);
       display:grid; place-items:center; padding:26px; text-align:center; }
.gate[hidden]{ display:none; }
.gate .inner{ max-width:380px; }
.gate h2{ font-family:'Fraunces',Georgia,serif; font-size:26px; font-weight:600;
          margin:18px 0 10px; letter-spacing:-.02em; }
.gate p{ color:var(--muted); font-size:15px; }
.gbtn{
  margin-top:22px; display:inline-flex; align-items:center; gap:10px; cursor:pointer;
  font:inherit; font-size:15px; font-weight:600; background:#fff; color:#1f1f1f;
  border:0; border-radius:99px; padding:12px 22px;
}
.gbtn:disabled{ opacity:.6; cursor:default; }
.gerr{ margin-top:16px; font-size:13.5px; color:var(--red); min-height:20px; }

#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(16px);
  background:var(--ink); color:var(--bg); font-size:14px; font-weight:500;
  padding:11px 18px; border-radius:99px; opacity:0; pointer-events:none;
  transition:all .25s; z-index:70; max-width:90vw; text-align:center;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:560px){
  .stats{ grid-template-columns:1fr 1fr 1fr; gap:7px; }
  .stat{ padding:10px; } .stat b{ font-size:21px; }
  .controls{ flex-direction:column; }
  select, textarea, .save{ width:100%; }
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="inner">
    <div class="mark" style="width:52px;height:52px;border-radius:16px;margin:0 auto">
      <svg width="28" height="28" viewBox="0 0 42 42" fill="none" aria-hidden="true">
        <circle cx="21" cy="21" r="14.5" stroke="#1b1f14" stroke-width="3"/>
        <circle cx="21" cy="21" r="5.2" fill="#c2482f"/>
      </svg>
    </div>
    <h2 id="gateTitle">Mess Committee</h2>
    <p id="gateMsg">Sign in to see the issues students have reported.</p>
    <button class="gbtn" id="gbtn" type="button">
      <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.7-.4-4H24v7.5h12c-.2 2-1.5 5-4.4 7l6.7 5.2C42.2 36 45 30.6 45 24z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.7-5.2c-1.8 1.3-4.3 2.2-7.8 2.2-6 0-11-4-12.8-9.4l-7 5.4C7.8 41 15.3 46 24 46z"/><path fill="#FBBC05" d="M11.2 28.3A13.5 13.5 0 0 1 10.5 24c0-1.5.3-3 .7-4.3l-7-5.4A22 22 0 0 0 2 24c0 3.5.8 6.9 2.2 9.7l7-5.4z"/><path fill="#EA4335" d="M24 10.4c3.3 0 5.6 1.4 6.9 2.6l5.9-5.8C33.2 3.7 28.5 2 24 2 15.3 2 7.8 7 4.2 14.3l7 5.4C13 14.3 18 10.4 24 10.4z"/></svg>
      Continue with Google
    </button>
    <div class="gerr" id="gerr"></div>
  </div>
</div>

<header>
  <div class="wrap hrow">
    <div class="mark">
      <svg width="18" height="18" viewBox="0 0 42 42" fill="none" aria-hidden="true">
        <circle cx="21" cy="21" r="14.5" stroke="#1b1f14" stroke-width="3"/>
        <circle cx="21" cy="21" r="5.2" fill="#c2482f"/>
      </svg>
    </div>
    <div>
      <h1>Mess Committee</h1>
      <div class="sub">Reported issues</div>
    </div>
    <div class="spacer"></div>
    <div class="who">
      <div id="whoName">—</div>
      <button class="linkbtn" id="signout" type="button">Sign out</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters">
    <button type="button" data-f="open"      aria-pressed="true">Needs attention</button>
    <button type="button" data-f="submitted" aria-pressed="false">Submitted</button>
    <button type="button" data-f="reviewing" aria-pressed="false">Being looked at</button>
    <button type="button" data-f="resolved"  aria-pressed="false">Resolved</button>
    <button type="button" data-f="all"       aria-pressed="false">All</button>
  </div>
  <div id="list"></div>
</main>

<div id="toast"></div>

<script src="./supabase.js"></script>
<script>
const SUPABASE_URL = "https://ryxpakwvkeddixwjsono.supabase.co";
const SUPABASE_KEY = "sb_publishable_e0R8NmRfRimm9sA2KWitrQ_eOuart3h";

const HALLS  = { g:'G Mess', ab:'AB Mess', cd:'CD Mess' };
const LABELS = { submitted:'Submitted', reviewing:'Being looked at', resolved:'Resolved' };

let sb = null, session = null, rows = [], filter = 'open';

/* ---------------- small helpers ---------------- */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__t);
  window.__t = setTimeout(() => t.classList.remove('show'), ms || 2600);
}
function when(iso){
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const mins = Math.round((now - d) / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24)  return hrs + ' hr ago';
  const days = Math.round(hrs / 24);
  if (days < 7)  return days + (days === 1 ? ' day ago' : ' days ago');
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
}

/* ---------------- the gate ----------------
   Two different refusals, and they must not be confused: "you are not signed
   in" invites a sign-in, "you are signed in but not on the committee" must
   not, or a student taps Google forever wondering why it never works. */
function showGate(title, msg, showBtn){
  const g = document.getElementById('gate');
  document.getElementById('gateTitle').textContent = title;
  document.getElementById('gateMsg').textContent   = msg;
  document.getElementById('gbtn').hidden = !showBtn;
  g.hidden = false;
}
function hideGate(){ document.getElementById('gate').hidden = true; }

async function signIn(){
  const btn = document.getElementById('gbtn');
  btn.disabled = true;
  document.getElementById('gerr').textContent = '';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname }
  });
  if (error){
    btn.disabled = false;
    document.getElementById('gerr').textContent = error.message || 'Sign-in failed.';
  }
}

/* ---------------- data ---------------- */
async function load(){
  // `mess` is not selected: the column was dropped on 2026-09-22 and asking
  // for it now fails the whole query with PGRST204.
  const { data, error } = await sb.from('complaints')
    .select('id,ref,hall,comment,roll,full_name,status,committee_note,served_on,created_at,photo_url')
    .order('created_at', { ascending:false })
    .limit(300);
  if (error){ toast("Couldn't load: " + (error.message || 'unknown error'), 6000); return; }
  rows = data || [];
  render();
}

async function save(id, status, note, card){
  card.classList.add('busy');
  const { error } = await sb.from('complaints')
    .update({ status: status, committee_note: note || null })
    .eq('id', id);
  card.classList.remove('busy');
  if (error){
    // 42501 here means the account is not on the committee list — the page
    // let them try, the database did not.
    const code = String(error.code || '');
    toast(code === '42501'
      ? 'The database refused that — this account is not on the committee list.'
      : "Couldn't save: " + (error.message || 'unknown error'), 6000);
    return false;
  }
  const r = rows.find(x => x.id === id);
  if (r){ r.status = status; r.committee_note = note || null; }
  toast('Saved — the student sees this now.');
  render();
  return true;
}

/* ---------------- render ---------------- */
function render(){
  const counts = { submitted:0, reviewing:0, resolved:0 };
  rows.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });

  document.getElementById('stats').innerHTML = `
    <div class="stat s-submitted"><b>${counts.submitted}</b><span>Submitted</span></div>
    <div class="stat s-reviewing"><b>${counts.reviewing}</b><span>Looking at</span></div>
    <div class="stat s-resolved"><b>${counts.resolved}</b><span>Resolved</span></div>`;

  const shown = rows.filter(r => {
    if (filter === 'all')  return true;
    if (filter === 'open') return r.status !== 'resolved';
    return r.status === filter;
  });

  const list = document.getElementById('list');
  if (!shown.length){
    list.innerHTML = `<div class="empty">
      <h3>${filter === 'open' ? 'Nothing waiting' : 'Nothing here'}</h3>
      <p>${filter === 'open'
            ? 'Every reported issue has been resolved.'
            : 'No issues with this status.'}</p></div>`;
    return;
  }

  list.innerHTML = shown.map(r => {
    // An unrecognised status still has to render as something: rows from
    // before the migration say 'open', and a blank chip tells nobody anything.
    const st = LABELS[r.status] ? r.status : 'submitted';
    return `<div class="card" data-id="${r.id}">
      <div class="ctop">
        <span class="hall">${esc(HALLS[r.hall] || r.hall || 'Mess')}</span>
        <span class="chip ${st}">${LABELS[st]}</span>
        <span class="spacer" style="flex:1"></span>
        <span class="when">${esc(when(r.created_at))}</span>
      </div>
      <div class="text">${esc(r.comment)}</div>
      <div class="by">
        <b>${esc(r.full_name || 'Name not given')}</b>${r.roll ? ' · ' + esc(r.roll) : ''}
        ${r.ref ? ' · <span class="ref">' + esc(r.ref) + '</span>' : ''}
      </div>
      ${r.photo_url ? `<img class="cphoto" alt="Photo attached to this report" data-photo="${esc(r.photo_url)}">` : ''}
      ${r.committee_note ? `<div class="note">${esc(r.committee_note)}</div>` : ''}
      <div class="controls">
        <select data-role="status">
          ${['submitted','reviewing','resolved'].map(s =>
            `<option value="${s}"${s === st ? ' selected' : ''}>${LABELS[s]}</option>`).join('')}
        </select>
        <textarea data-role="note" placeholder="What's being done? The student sees this."
          >${esc(r.committee_note || '')}</textarea>
        <button class="save" type="button">Save</button>
      </div>
    </div>`;
  }).join('');
  hydratePhotos();
}

const signedCache = {};
async function hydratePhotos(){
  for (const img of [...document.querySelectorAll('.cphoto[data-photo]')]){
    const path = img.getAttribute('data-photo');
    img.removeAttribute('data-photo');
    let url = signedCache[path];
    if (!url){
      try{
        const { data, error } = await sb.storage.from('complaint-photos')
          .createSignedUrl(path, 600);
        if (error || !data) { img.remove(); continue; }
        url = signedCache[path] = data.signedUrl;
      }catch(e){ img.remove(); continue; }
    }
    img.src = url;
    img.classList.add('ready');
    img.onclick = () => window.open(url, '_blank', 'noopener');
  }
}

/* ---------------- events ---------------- */
document.getElementById('list').addEventListener('click', async e => {
  const btn = e.target.closest('.save'); if (!btn) return;
  const card = btn.closest('.card');
  await save(Number(card.dataset.id),
             card.querySelector('[data-role="status"]').value,
             card.querySelector('[data-role="note"]').value.trim(),
             card);
});
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  [...e.currentTarget.children].forEach(x =>
    x.setAttribute('aria-pressed', String(x === b)));
  render();
});
document.getElementById('gbtn').addEventListener('click', signIn);
document.getElementById('signout').addEventListener('click', async () => {
  try{ await sb.auth.signOut(); }catch(e){}
  location.reload();
});

/* ---------------- boot ---------------- */
(async function(){
  if (!window.supabase || !window.supabase.createClient){
    showGate('Cannot load', 'supabase.js did not load. Reload the page.', false);
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });

  try{
    const { data } = await sb.auth.getSession();
    session = data ? data.session : null;
  }catch(e){ session = null; }

  sb.auth.onAuthStateChange((evt, s) => {
    if (evt === 'SIGNED_IN' && s && !session){ session = s; ready(); }
    if (evt === 'SIGNED_OUT') location.reload();
  });

  if (session) ready();
  else showGate('Mess Committee', 'Sign in to see the issues students have reported.', true);
})();

async function ready(){
  const email = (session.user && session.user.email) || '';
  document.getElementById('whoName').textContent = email;

  // Ask the database, not a list in this file. is_committee() reads a table
  // the browser cannot read for itself, which is the point of it existing.
  let member = false;
  try{
    const { data, error } = await sb.rpc('is_committee');
    if (error) throw error;
    member = data === true;
  }catch(e){
    showGate('Not set up yet',
      'The committee list is not configured on the server. Run 06_committee.sql, then reload.', false);
    return;
  }

  if (!member){
    showGate('Not on the committee list',
      'You are signed in as ' + email + ', which is not a committee account. '
      + 'Ask whoever runs the app to add you.', false);
    return;
  }

  hideGate();
  await load();
}
</script>
</body>
</html>
